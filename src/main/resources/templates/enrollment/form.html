<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isUpdate} ? 'Update Enrollment' : 'Add Enrollment'">Enrollment</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update Enrollment' : 'Add a New Enrollment'">Enrollment</h1>

<form th:action="@{/enrollment}" th:object="${enrollment}" method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" th:readonly="${isUpdate}" required /><br><br>

    <label>Student ID:</label>
    <input type="text" th:field="*{studentId}" required /><br><br>

    <label>Course ID:</label>
    <input type="text" th:field="*{courseId}" required /><br><br>

    <label>Grade:</label>
    <select th:field="*{grade}" required>
        <option th:each="type : ${gradeTypes}"
                th:value="${type}"
                th:text="${type}"></option>
    </select><br><br>

    <label>Enrollment Date:</label>
    <input type="date" th:field="*{enrollmentDate}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/enrollment}">Back to list</a>
</body>
</html>
