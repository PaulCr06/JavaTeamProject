<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isUpdate} ? 'Update Teacher' : 'Add Teacher'">Teacher</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update Teacher' : 'Add a New Teacher'">Teacher</h1>

<form th:action="${isUpdate} ? @{/teacher/{id}(id=${teacher.id})} : @{/teacher}" th:object="${teacher}" method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" th:readonly="${isUpdate}" required /><br><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br><br>

    <label>Title:</label>
    <input type="text" th:field="*{title}" required /><br><br>

    <label>Department ID:</label>
    <input type="text" th:field="*{departmentId}" required /><br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required /><br><br>

    <label>Hire Date:</label>
    <input type="date" th:field="*{hireDate}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/teacher}">Back to list</a>
</body>
</html>
