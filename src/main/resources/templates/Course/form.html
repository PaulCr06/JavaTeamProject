<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isUpdate} ? 'Update Course' : 'Add Course'">Course</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update Course' : 'Add a New Course'">Course</h1>

<form th:action="${isUpdate} ? @{/courses/{id}(id=${course.id})} : @{/courses}" th:object="${course}" method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" th:readonly="${isUpdate}" required /><br><br>

    <label>Title:</label>
    <input type="text" th:field="*{title}" required /><br><br>

    <label>Credits:</label>
    <input type="number" th:field="*{credits}" required /><br><br>

    <label>Department ID:</label>
    <input type="text" th:field="*{departmentId}" required /><br><br>

    <label>Room ID:</label>
    <input type="text" th:field="*{roomId}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/courses}">Back to list</a>
</body>
</html>
