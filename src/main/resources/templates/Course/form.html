<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Course</title>
</head>
<body>
<h1>Add a New Course</h1>

<form th:action="@{/course}" th:object="${course}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required /><br><br>

    <label>Title:</label>
    <input type="text" th:field="*{title}" required /><br><br>

    <label>Credits:</label>
    <input type="number" th:field="*{credits}" required /><br><br>

    <label>DepartmentId:</label>
    <input type="text" th:field="*{departmentId}" required /><br><br>

    <label>RoomID:</label>
    <input type="text" th:field="*{roomId}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/course}">Back to list</a>
</body>
</html>
