<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course List</title>
</head>
<body>
<h1>Course List</h1>
<a th:href="@{/courses/new}">Add a new course</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Credits</th>
        <th>Department ID</th>
        <th>Room ID</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${courses}">
        <td th:text="${item.id}">ID</td>
        <td th:text="${item.title}">Title</td>
        <td th:text="${item.credits}">Credits</td>
        <td th:text="${item.departmentId}">Department ID</td>
        <td th:text="${item.roomId}">Room ID</td>
        <td>
            <form th:action="@{/courses/{id}(id=${item.id})}" method="get" style="display:inline;">
                <button type="submit">Details</button>
            </form>
            <form th:action="@{/courses/{id}/edit(id=${item.id})}" method="get" style="display:inline;">
                <button type="submit">Update</button>
            </form>
            <form th:action="@{'/courses/' + ${item.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
