<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Department</title>
</head>
<body>
<!--/*@thymesVar id="" type="com.example.demo.model.Assistant"*/-->
<h1>Add a New Department</h1>

<form th:action="@{/department}" th:object="${department}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required /><br><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br><br>

    

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/department}">Back to list</a>
</body>
</html>
