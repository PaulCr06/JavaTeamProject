<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isUpdate} ? 'Update Department' : 'Add Department'">Department</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update Department' : 'Add a New Department'">Department</h1>

<form th:action="${isUpdate} ? @{/department/{id}(id=${department.id})} : @{/department}" th:object="${department}" method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" th:readonly="${isUpdate}" required /><br><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/department}">Back to list</a>
</body>
</html>
