<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isUpdate} ? 'Update Assignment' : 'Add Assignment'">Assignment</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update Assignment' : 'Add a New Assignment'">Assignment</h1>

<form th:action="@{/teachingassignment}" th:object="${teachingAssignment}" method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" th:readonly="${isUpdate}" required /><br><br>

    <label>Course ID:</label>
    <input type="text" th:field="*{courseId}" required /><br><br>

    <label>Staff ID:</label>
    <input type="text" th:field="*{staffId}" required /><br><br>

    <label>Managing Role:</label>
    <select th:field="*{managing}" required>
        <option th:each="type : ${managingTypes}"
                th:value="${type}"
                th:text="${type}"></option>
    </select><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/teachingassignment}">Back to list</a>
</body>
</html>
