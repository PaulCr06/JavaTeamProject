<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teaching Assignment List</title>
</head>
<body>
<h1>Teaching Assignment List</h1>
<a th:href="@{/teachingassignment/new}">Add a new assignment</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Course ID</th>
        <th>Staff ID</th>
        <th>Managing Role</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${assignments}">
        <td th:text="${item.id}">1</td>
        <td th:text="${item.courseId}">C1</td>
        <td th:text="${item.staffId}">S1</td>
        <td th:text="${item.managing}">ROLE</td>
        <td>
            <form th:action="@{/teachingassignment/{id}(id=${item.id})}" method="get">
                <button type="submit">Details</button>
            </form>
            <form th:action="@{'/teachingassignment/' + ${item.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
