<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Teaching Assignment</title>
</head>
<body>
<!--/*@thymesVar id="teachingAssignment" type="com.example.demo.model.TeachingAssignment"*/-->
<h1>Add a New Assignment</h1>

<form th:action="@{/teachingassignment}" th:object="${teachingAssignment}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required /><br><br>

    <label>Course ID:</label>
    <input type="text" th:field="*{courseId}" required /><br><br>

    <label>Staff ID:</label>
    <input type="text" th:field="*{staffID}" required /><br><br>

    <label>Managing Role:</label>
    <select th:field="*{managing}" required>
        <!-- Iterăm prin valorile din enum trimise de Controller -->
        <option th:each="type : ${managingTypes}"
                th:value="${type}"
                th:text="${type}"></option>
    </select><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/teachingassignment}">Back to list</a>
</body>
</html>
