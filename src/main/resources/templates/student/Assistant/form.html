<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Assistant</title>
</head>
<body>
<!--/*@thymesVar id="assistant" type="com.example.demo.model.Assistant"*/-->
<h1>Add a New Assistant</h1>

<form th:action="@{/assistant}" th:object="${assistant}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required /><br><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br><br>

    <label>Role:</label>
    <input type="text" th:field="*{role}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/assistant}">Back to list</a>
</body>
</html>
