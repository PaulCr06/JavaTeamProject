<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student List</title>
</head>
<body>
<h1>Student List</h1>
<a th:href="@{/student/new}">Add a new student</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Date of Birth</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${students}">
        <td th:text="${item.id}">1</td>
        <td th:text="${item.name}">Name</td>
        <td th:text="${item.birthDate}">Date</td>
        <td th:text="${item.email}">Email</td>
        <td>
            <form th:action="@{/student/{id}(id=${item.id})}" method="get">
                <button type="submit">Details</button>
            </form>
            <form th:action="@{'/student/' + ${item.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
