<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isUpdate} ? 'Update Student' : 'Add Student'">Student</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update Student' : 'Add a New Student'">Student</h1>

<form th:action="${isUpdate} ? @{/student/{id}(id=${student.id})} : @{/student}" th:object="${student}" method="post">
    <p th:if="${isUpdate}">ID: <strong th:text="${student.id}"></strong></p>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required /><br><br>

    <label>Birth Date:</label>
    <input type="date" th:field="*{birthDate}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/student}">Back to list</a>
</body>
</html>
