<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Student Details</title></head>
<body>
<h1>Student Details</h1>
<p>ID: <span th:text="${student.id}"></span></p>
<p>Name: <span th:text="${student.name}"></span></p>
<p>Date of Birth: <span th:text="${student.birthDate}"></span></p>
<p>Email: <span th:text="${student.email}"></span></p>
<a th:href="@{/student}">Back to list</a>
</body>
</html>
