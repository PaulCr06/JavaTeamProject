<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Enrollment</title>
</head>
<body>
<!--/*@thymesVar id="enrollment" type="com.example.demo.model.Enrollment"*/-->
<h1>Add a New Enrollment</h1>

<form th:action="@{/enrollment}" th:object="${enrollment}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required /><br><br>

    <label>Student ID:</label>
    <input type="text" th:field="*{studentId}" required /><br><br>

    <label>Course ID:</label>
    <input type="text" th:field="*{courseID}" required /><br><br>

    <label>Grade:</label>
    <input type="text" th:field="*{grade}" required /><br><br>

    <label>Enrollment Date:</label>
    <input type="date" th:field="*{enrollmentDate}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/enrollment}">Back to list</a>
</body>
</html>
