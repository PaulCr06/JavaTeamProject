<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isUpdate} ? 'Update University' : 'Add University'">University</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update University' : 'Add a New University'">University</h1>

<form th:action="${isUpdate} ? @{/university/{id}(id=${university.id})} : @{/university}" th:object="${university}" method="post">
    <p th:if="${isUpdate}">ID: <strong th:text="${university.id}"></strong></p>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br><br>

    <label>City:</label>
    <input type="text" th:field="*{city}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/university}">Back to list</a>
</body>
</html>
