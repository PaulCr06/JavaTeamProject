<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add University</title>
</head>
<body>
<h1>Add a New University</h1>

<form th:action="@{/university}" th:object="${university}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required /><br><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br><br>

    <label>City:</label>
    <input type="text" th:field="*{city}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/university}">Back to list</a>
</body>
</html>
