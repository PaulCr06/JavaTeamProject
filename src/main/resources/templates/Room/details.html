<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Room Details</title></head>
<body>
<h1>Room Details</h1>
<p>ID: <span th:text="${room.id}"></span></p>
<p>Number: <span th:text="${room.number}"></span></p>
<p>Capacity: <span th:text="${room.capacity}"></span></p>
<p>Courses: <span th:text="${#lists.size(room.courses)}"></span></p>
<a th:href="@{/room}">Back to list</a>
</body>
</html>
