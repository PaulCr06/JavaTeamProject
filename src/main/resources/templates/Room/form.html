<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Room</title>
</head>
<body>
<h1>Add a New Room</h1>

<form th:action="@{/room}" th:object="${room}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required /><br><br>

    <label>Number:</label>
    <input type="text" th:field="*{number}" required /><br><br>

    <label>Capacity:</label>
    <input type="number"  th:field="*{capacity}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/room}">Back to list</a>
</body>
</html>
