<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isUpdate} ? 'Update Room' : 'Add Room'">Room</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update Room' : 'Add a New Room'">Room</h1>

<form th:action="@{/room}" th:object="${room}" method="post">

    <label>ID:</label>
    <input type="text" th:field="*{id}" th:readonly="${isUpdate}" required /><br><br>

    <label>Number:</label>
    <input type="text" th:field="*{number}" required /><br><br>

    <label>Capacity:</label>
    <input type="number" step="any" th:field="*{capacity}" required /><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/room}">Back to list</a>
</body>
</html>
