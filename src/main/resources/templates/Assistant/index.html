<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Assistant List</title>
</head>
<body>
<h1>Assistant List</h1>
<a th:href="@{/assistant/new}">Add a new assistant</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${assistants}">
        <td th:text="${item.id}">1</td>
        <td th:text="${item.name}">Name</td>
        <td th:text="${item.role}">Role</td>
        <td>
            <form th:action="@{/assistant/{id}(id=${item.id})}" method="get">
                <button type="submit">Details</button>
            </form>
            <form th:action="@{'/assistant/' + ${item.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
