<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isUpdate} ? 'Update Assistant' : 'Add Assistant'">Assistant</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update Assistant' : 'Add a New Assistant'">Assistant</h1>

<form th:action="${isUpdate} ? @{/assistant/{id}(id=${assistant.id})} : @{/assistant}" th:object="${assistant}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" th:readonly="${isUpdate}" required /><br><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br><br>

    <label>Role:</label>
    <select th:field="*{role}" required>
        <option th:each="type : ${roleTypes}"
                th:value="${type}"
                th:text="${type}"></option>
    </select><br><br>

    <button type="submit">Save</button>
</form>
<br>
<a th:href="@{/assistant}">Back to list</a>
</body>
</html>
